<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet"
          href="../css/admin.css">
</head>

<body>

<div class="container">

    <h1>Admin Dashboard</h1>

    <p>
        Upload CSV file to create teacher accounts
    </p>

    <div class="upload-box">

        <input
                type="file"
                id="csvFile"
                accept=".csv"
        >

        <button onclick="uploadCsv()">
            Upload CSV
        </button>

    </div>

    <div id="resultBox"></div>

</div>

<script src="../js/admin.js"></script>

</body>
</html>
